# ─── Add these services to your existing docker-compose.yml ───────────────────
#
# This adds:
#   1. my_rihno_redis     — Redis server for the IDS AI pipeline
#   2. my_rihno_ids       — Python IDS Zero-Day Detection API
#   3. my_rihno_notify    — Python Notification Engine (email + SMS)
#
# Your existing services (my_rihno_db, my_rihno_kafka, dealer) remain unchanged.
# The dealer now writes to Redis IN ADDITION to PostgreSQL and Kafka.

services:

  # ── Your existing dealer (updated with Redis pipeline) ───────────────────────
  dealer:
    build: ./dealer
    ports:
      - "8000:8000"   # HTTP API
      - "8080:8080"   # TCP agent listener
    environment:
      - DB_URL=postgres://postgres:5001@my_rihno_db:5432/rihnodb?sslmode=disable
      - REDIS_HOST=my_rihno_redis
      - REDIS_PORT=6379
    depends_on:
      - my_rihno_db
      - my_rihno_kafka
      - my_rihno_redis

  # ── Redis for IDS AI Pipeline ────────────────────────────────────────────────
  my_rihno_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── IDS Zero-Day Detection API (Python) ──────────────────────────────────────
  my_rihno_ai_engine:
    build: ../../AI_and_ID_Engine/AI_Threat_Detection_Engine
    container_name: my_rihno_ai_engine
    ports:
      - "4050:4050"
    environment:
      - REDIS_HOST=my_rihno_redis
      - REDIS_PORT=6379
    depends_on:
      my_rihno_redis:
        condition: service_healthy

  # ── Notification Engine (Python) ─────────────────────────────────────────────
  my_rihno_notify:
    build: ../Notification_Engine
    container_name: my_rihno_notify
    ports:
      - "5060:5060"
    environment:
      - REDIS_HOST=my_rihno_redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
    depends_on:
      my_rihno_redis:
        condition: service_healthy

volumes:
  redis_data:
